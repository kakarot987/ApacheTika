spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Conservative defaults for an educational document extraction endpoint.
# A timeout cancels the Java task; it cannot forcibly terminate a parser.
app.parsing.max-file-bytes=10485760
app.parsing.max-text-chars=1000000
app.parsing.timeout-millis=15000
